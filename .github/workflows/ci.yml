# Runs on every push and pull request, and by hand from the Actions tab.
#
# checks: repository checks (documentation format, links, required files, no committed data or
#         build artefacts), Rust formatting and Clippy. Fast, so problems show up first.
# test:   both test suites on Linux, Windows and macOS. The dep1ex archives are not downloaded
#         here, so the tests that need them skip themselves; the reproduction targets are checked
#         locally against the published data.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Repository checks
        run: python tools/check_repo.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy -p demplan-core --all-targets -- -D warnings

  test:
    name: test ${{ matrix.os }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/Scripts/activate ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          python -m pip install maturin pytest pytest-xdist hypothesis numpy scipy pyarrow psutil
          maturin develop
      - name: pytest
        shell: bash
        run: |
          if [ -f .venv/Scripts/activate ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          pytest -q -n auto
      - name: cargo test
        run: cargo test -p demplan-core
