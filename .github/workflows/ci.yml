# Runs both test suites on every push and pull request.
#
# The dep1ex archives are not downloaded here, so the tests that need them skip themselves;
# the reproduction targets are checked locally against the published data.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/Scripts/activate ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          python -m pip install maturin pytest hypothesis numpy scipy pyarrow psutil
          maturin develop
      - name: pytest
        shell: bash
        run: |
          if [ -f .venv/Scripts/activate ]; then source .venv/Scripts/activate; else source .venv/bin/activate; fi
          pytest -q
      - name: cargo test
        run: cargo test -p demplan-core
