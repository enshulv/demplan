[workspace]
resolver = "2"
members = ["crates/demplan-core", "crates/demplan-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/enshulv/demplan"

[workspace.dependencies]
thiserror = "2"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
numpy = "0.29"

[profile.release]
codegen-units = 1
lto = "fat"
