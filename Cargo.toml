[workspace]
resolver = "2"
members = ["crates/cyberstride-core", "crates/cyberstride-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/enshulv/cyberstride"

[workspace.dependencies]
thiserror = "2"
flate2 = "1"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
numpy = "0.29"

[profile.release]
codegen-units = 1
lto = "fat"
