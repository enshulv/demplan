[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "demplan"
version = "0.1.0"
description = "Shared research infrastructure for democratic economic planning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "hypothesis", "pyarrow", "psutil"]

[tool.maturin]
python-source = "python"
module-name = "demplan._core"
manifest-path = "crates/demplan-py/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the dep1ex data files or a release build; deselect with -m 'not slow'"]
